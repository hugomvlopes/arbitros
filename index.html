<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefKit Pro - Gestor de Jogos</title>
    <style>
        :root { --primary: #1e272e; --accent: #2ecc71; --bg: #f1f2f6; --text: #2f3640; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; padding-bottom: 150px; }
        
        /* Painel de Jogo Superior */
        .game-panel {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        .selectors { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        select { padding: 10px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; }
        
        .visual-match { display: flex; justify-content: center; gap: 40px; align-items: center; }
        .team-box { text-align: center; width: 150px; }
        .kit-preview { 
            width: 60px; height: 60px; margin: 0 auto 10px; 
            border-radius: 10px; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 25px; color: white; text-shadow: 1px 1px 2px black;
        }

        /* Grelha de Árbitros (Estilo Clean) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; border: 1px solid #ddd; position: relative; }
        .card.selected { border: 2px solid var(--accent); background: #f0fff4; }
        .name { font-weight: bold; font-size: 1.2em; display: block; }
        .kits-flex { display: flex; gap: 10px; margin-top: 15px; }
        .kit-item { position: relative; width: 70px; text-align: center; }
        .kit-img { width: 100%; height: 70px; object-fit: contain; cursor: pointer; transition: 0.3s; }
        .kit-img:hover { transform: scale(2.5); z-index: 100; position: relative; background: white; border: 1px solid #ddd; }
        .qty-badge { position: absolute; top: -5px; right: -2px; background: var(--danger); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid white; }
        
        .team-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); color: white; padding: 15px; display: none; flex-direction: column; align-items: center; z-index: 1000; }
        .btn-whatsapp { background: #25D366; color: white; border: none; padding: 10px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-panel">
    <h3>Logística do Jogo</h3>
    <div class="selectors">
        <div>
            <label>Equipa Visitada:</label><br>
            <select id="casa" onchange="updateMatch()">
                <option value="">Selecionar...</option>
            </select>
        </div>
        <div style="font-size: 2em; align-self: center;">VS</div>
        <div>
            <label>Equipa Visitante:</label><br>
            <select id="fora" onchange="updateMatch()">
                <option value="">Selecionar...</option>
            </select>
        </div>
    </div>
    <div class="visual-match" id="matchDisplay" style="display:none;">
        <div class="team-box">
            <div id="kitCasa" class="kit-preview">👕</div>
            <div id="nomeCasa" style="font-weight:bold; font-size:0.9em;"></div>
        </div>
        <div style="font-weight:bold; color:#666;">CONFLITO?</div>
        <div class="team-box">
            <div id="kitFora" class="kit-preview">👕</div>
            <div id="nomeFora" style="font-weight:bold; font-size:0.9em;"></div>
        </div>
    </div>
</div>

<div class="grid" id="mainGrid"></div>

<div id="teamBar" class="team-bar">
    <button class="btn-whatsapp" onclick="sendWhatsApp()">Enviar Convocatória Logística 📱</button>
    <div id="selectedContainer" style="display:flex; gap:15px; margin-top:10px;"></div>
</div>

<script>
    // DADOS DAS EQUIPAS (Extraídos do teu Excel de Seniores)
    const CLUBES = {
        "Castro Daire": { camisola: "Verde e Amarelo", calcao: "Verde", corHex: "#27ae60" },
        "Oliveira de Frades": { camisola: "Azul e Preta", calcao: "Preto", corHex: "#2980b9" },
        "Mangualde": { camisola: "Amarela", calcao: "Azul", corHex: "#f1c40f" },
        "Ferreira de Aves": { camisola: "Preta", calcao: "Preto", corHex: "#2c3e50" },
        "SL Nelas": { camisola: "Vermelha", calcao: "Branco", corHex: "#e74c3c" },
        "Carregal do Sal": { camisola: "Branca com Azul", calcao: "Branco", corHex: "#ecf0f1" }
    };

    const KITS_BASE = {
        mac_rosa: { m: "Macron", c: "Rosa", i: "https://stylfoot.fr/3929-large_default/referee-shirt-women-uefa-pink.jpg" },
        mac_preto: { m: "Macron", c: "Preto", i: "https://www.macron.com/media/catalog/product/cache/7854776c5a059fa4314600f243e72018/8/6/865e817e7d6654733c8f8fa12c66e87a800001930900.jpg" }
        // ... (restantes kits aqui)
    };

    // Populando os Selects
    const casaSel = document.getElementById('casa');
    const foraSel = document.getElementById('fora');
    Object.keys(CLUBES).forEach(clube => {
        casaSel.add(new Option(clube, clube));
        foraSel.add(new Option(clube, clube));
    });

    function updateMatch() {
        const c = CLUBES[casaSel.value];
        const f = CLUBES[foraSel.value];
        const display = document.getElementById('matchDisplay');
        
        if(c && f) {
            display.style.display = 'flex';
            document.getElementById('nomeCasa').innerText = casaSel.value;
            document.getElementById('kitCasa').style.backgroundColor = c.corHex;
            document.getElementById('nomeFora').innerText = foraSel.value;
            document.getElementById('kitFora').style.backgroundColor = f.corHex;
        }
    }

    // [Lógica de carregamento de árbitros do Google Sheets anterior mantém-se aqui]
</script>
</body>
</html>
